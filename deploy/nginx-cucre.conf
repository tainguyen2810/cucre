# Cấu hình Nginx cho cucre.vn (aaPanel: Website › cucre.vn › Config, dán phần trong server {} hoặc thay toàn bộ).
# Thay /www/wwwroot/cucre bằng thư mục code, /www/cucre-uploads bằng UPLOAD_DIR trong .env.

upstream cucre_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cucre.vn www.cucre.vn;
    # aaPanel tự thêm khối SSL (listen 443, ssl_certificate...) khi bật Let's Encrypt.
    # Sau khi có SSL, bật "Force HTTPS" trong aaPanel.

    # www → không www
    if ($host = www.cucre.vn) {
        return 301 https://cucre.vn$request_uri;
    }

    client_max_body_size 10m;   # upload ảnh tối đa 8MB

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /www/wwwlogs/cucre.vn.log;
    error_log  /www/wwwlogs/cucre.vn.error.log;

    # Ảnh upload: Nginx phục vụ thẳng, không qua Node
    location /uploads/ {
        alias /www/cucre-uploads/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # File tĩnh của Next.js (tên có mã băm → cache lâu)
    location /_next/static/ {
        proxy_pass http://cucre_app;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Chặn truy cập file ẩn (.env, .git)
    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://cucre_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # cho phép streaming của Next.js
        proxy_read_timeout 60s;
    }
}
